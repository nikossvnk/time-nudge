name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # for publishing releases on tags

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-23 aapt apksigner dalvik-exchange zipalign

      # The signing key is a base64-encoded repository secret, never part of the repo. build.sh
      # fails if it's missing, so a build is never signed with a different key.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/timenudge.jks"

      - name: Build
        run: KEYSTORE="$RUNNER_TEMP/timenudge.jks" ./build.sh

      # Robolectric 3.8 needs JDK 8. Set up after building so build.sh uses the system JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Test
        run: cd test && mvn -q -B test

      # TimeNudge-1.2.1.apk rather than TimeNudge.apk, so downloads can be told apart.
      - name: Name the APK after its version
        id: apk
        run: |
          version=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml)
          [ -n "$version" ] || { echo "::error::No versionName in AndroidManifest.xml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version"
            exit 1
          fi
          mv build/TimeNudge.apk "build/TimeNudge-$version.apk"
          echo "name=TimeNudge-$version" >> "$GITHUB_OUTPUT"
          echo "path=build/TimeNudge-$version.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/timenudge.jks"
